version: '3.8'

services:
  backend:
    build: .
    container_name: ip-sakti-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=IP-SAKTI Sahayak Backend
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=sqlite:///./ip_sakti.db
      - LLM_PROVIDER=mock
      - VECTOR_DB_TYPE=in-memory
    volumes:
      - .:/app
    restart: unless-stopped
